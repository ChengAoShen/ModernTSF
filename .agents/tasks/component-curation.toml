schema_version = 1
name = "component-curation"
title = "Shared component curation"
summary = "Periodically find repeated model blocks, prefer existing components, and extract only proven reusable contracts."
skills = ["curate-components", "audit-model"]
acceptance = [
  "Inventory component cards first and prefer reuse of an existing equivalent over a new extraction.",
  "Compare equations, axes, normalization, masking, state, initialization, and outputs.",
  "Record reuse, extraction, or keep-local decisions for every candidate.",
  "Prove output and gradient equivalence before deleting local implementations.",
  "Give concurrent reviews non-overlapping model ownership and serialize shared-component edits.",
  "Keep all model packages flat, regenerate cards, and pass component, affected-model, and repository audits.",
  "Treat a fully reviewed no-change result as valid instead of forcing an abstraction.",
]
prompt = """
Inspect the following component candidate or operation: {candidate}. Across
{scope}, first search for reuse of existing cataloged components, then shortlist
repeated model-local blocks using structural evidence. Extract only the smallest
paper-neutral API for proven equivalent implementations with at least two actual
consumers; leave material variants local. Regenerate component cards, refresh
affected verification evidence, and report reuse/extract/keep-local decisions.
"""

[inputs.candidate]
description = "Operation or component candidate; omit for a periodic repository-wide duplicate scan."
required = false
default = "repository-wide repeated implementation scan, prioritizing models added or changed since the previous pass"

[inputs.scope]
description = "Models or repository area to inspect."
required = false
default = "the complete flat model catalog"

[permissions]
network = "none-unless-paper-semantics-require-primary-source-check"
repository = "write-components-affected-models-and-tests"
external_actions = "none"

[budget]
max_component_extractions = 2
max_models_changed = 12
max_wall_minutes = 180
