schema_version = 1
name = "paper-reproduction"
title = "Paper result reproduction"
summary = "Map one paper experiment to traceable configs and compare aligned result cells."
skills = ["reproduce-paper-results", "run-experiment", "analyze-results"]
acceptance = [
  "Classify every protocol field as aligned, adapted, unknown, or blocked.",
  "Keep faithful replication separate from controlled adaptations.",
  "Preserve configs, environment, seeds, raw results, and failed cells.",
  "Report paper/local values and deviations without overstating reproduction success.",
]
prompt = """
Reproduce the experiment from {paper_url}, focusing on {target}. Use at most
{max_runs} runs. Verify that the local model is already audited before spending
compute; stop for a decision when missing data or protocol ambiguity changes the claim.
"""

[inputs.paper_url]
description = "Primary paper or proceedings URL."
required = true

[inputs.target]
description = "Table, dataset, horizon, or ablation to reproduce."
required = true

[inputs.max_runs]
description = "Hard cap on resolved experiment runs."
required = false
default = "20"
maximum = 20

[permissions]
network = "read-primary-paper-supplement-and-authoritative-source"
repository = "write-run-configs-and-experiment-outputs"
model_code = "read-only"
external_actions = "none"

[budget]
max_runs = 20
max_parallel_jobs = 2
max_wall_minutes = 720
