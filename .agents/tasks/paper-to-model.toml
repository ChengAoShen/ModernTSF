name = "paper-to-model"
title = "Paper-to-model integration"
summary = "Turn one approved forecasting paper into one audited flat-catalog model entry."
skills = ["extract-paper-structure", "implement-model", "add-model", "curate-components", "audit-model"]
acceptance = [
  "Require a primary paper URL, deduplication result, explicit implementation authorization, defining equations, inputs, and official-source facts.",
  "Inspect pinned official code when available to resolve paper omissions, but never copy or import external model source.",
  "Classify every required block as reuse-existing, extract-new, or model-local; reuse an existing equivalent first.",
  "Keep the model flat, keep README as descriptive metadata source, and preserve useful paper comments.",
  "Pass unified verification, model audit, focused tests, strict runtime contracts, component audit, and repository audit.",
]
prompt = """
Integrate the approved paper at {paper_url} as model name {model_name}.
Approval context: {approval}
Before writing code, confirm the paper identity, inputs,
outputs, defining equations, and official-source facts. Build a component decision
map and reuse existing components whenever semantic equivalence is proven. Keep
unmatched paper-specific operations model-local. Write a local implementation,
record all deviations and source facts, and do not weaken existing contracts,
publish, push, dispatch additional tasks, or open external issues.
"""

[inputs.paper_url]
description = "Primary paper URL."
required = true

[inputs.model_name]
description = "Approved public model name."
required = true

[inputs.approval]
description = "Implementation scope and any user constraints."
required = false
default = "Repository-local implementation and verification are authorized."

[permissions]
network = "read-primary-sources-and-authoritative-code"
repository = "write-one-model-and-proven-components"
external_actions = "none"

[budget]
max_models = 1
max_component_extractions = 2
max_wall_minutes = 240
