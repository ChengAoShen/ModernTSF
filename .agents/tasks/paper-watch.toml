name = "paper-watch"
title = "Forecasting paper watch"
summary = "Search, deduplicate, and rank newly published forecasting papers without modifying the repository."
skills = ["discover-papers"]
acceptance = [
  "Search arXiv and Hugging Face Papers across the forecasting query lattice.",
  "Deduplicate candidates against all canonical model cards.",
  "Return source-linked candidates or an explicit no-change result.",
  "Do not implement, dispatch, or edit the repository.",
]
prompt = """
Scan for time-series forecasting papers published since {since}. Focus on {focus}.
Use the canonical model catalog as the deduplication baseline. Rank at most {limit}
candidates and distinguish verified source facts from inference. Return a compact
candidate queue; an empty queue is valid.
"""

[inputs.since]
description = "Inclusive date or relative time boundary for the scan."
required = false
default = "30 days before this task's invocation time"

[inputs.focus]
description = "Optional task, architecture, data regime, or novelty focus."
required = false
default = "general-purpose forecasting models and methods"

[inputs.limit]
description = "Maximum number of ranked candidates."
required = false
default = "10"
maximum = 10
budget_key = "max_candidates"

[permissions]
network = "read-primary-sources"
repository = "read-only"
dispatch = "none"

[budget]
max_candidates = 10
max_dispatched_tasks = 0
max_wall_minutes = 30
