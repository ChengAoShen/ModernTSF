schema_version = 1
name = "repo-final-audit"
title = "Repository final audit"
summary = "Run the complete static, runtime, provenance, documentation, and Agent-infrastructure release gate."
skills = ["audit-repository", "audit-model-batch", "smoke-models"]
acceptance = [
  "All model cards, configs, specs, generated indexes, components, tasks, and skills are consistent.",
  "Every model passes strict construction, forward, backward, boundary, and serialization contracts.",
  "Every model has current upstream parity or rewrite validation evidence.",
  "Report exact failures without weakening or bypassing a gate.",
]
prompt = """
Run the final repository audit for {scope}. Regenerate only canonical projections,
then run the full test suite, model audit, repository audit, and unscoped strict
doctor. Do not change implementation claims merely to make counts pass. Fix only
in-scope deterministic defects; report unresolved paper, license, parity, or runtime
failures exactly.
"""

[inputs.scope]
description = "Release scope or revision being audited."
required = false
default = "the current dev worktree"

[permissions]
network = "read-only-for-link-and-source-verification"
repository = "write-deterministic-audit-fixes-and-generated-projections"
external_actions = "none"

[budget]
max_fix_batches = 3
max_wall_minutes = 240
