name: smoke-affected

# Targeted CI gate: on PRs that touch model or runner code, run `tsf smoke`
# scoped to the affected model(s) instead of the full `--all` sweep (that
# stays a nightly/manual job per CLAUDE.md). Detects the affected models from
# the PR diff; falls back to a small representative set (one point model +
# every probabilistic model) when the changed files can't be mapped to a
# specific smoke config, e.g. a src/benchmark/ runner change touches all
# models at once.

on:
  pull_request:
    paths:
      - "src/models/**"
      - "src/benchmark/**"

jobs:
  smoke-affected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected smoke configs
        id: detect
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "Changed files:"
          echo "$changed"

          fallback="configs/runs/smoke_crib.toml configs/runs/smoke_quantile_dlinear.toml configs/runs/smoke_gaussian_mlp.toml configs/runs/smoke_mqrnn.toml configs/runs/smoke_quantile_patchtst.toml"

          configs=""
          if echo "$changed" | grep -q '^src/benchmark/'; then
            configs="$fallback"
          else
            for mod in $(echo "$changed" | grep '^src/models/' | cut -d/ -f2 | sort -u || true); do
              for f in configs/runs/smoke_${mod}*.toml; do
                [ -f "$f" ] && configs="$configs $f"
              done
            done
            configs="$(echo "$configs" | xargs -n1 2>/dev/null | sort -u | xargs || true)"
            if [ -z "$configs" ] && echo "$changed" | grep -q '^src/models/'; then
              # Changed model(s) have no dedicated smoke config yet — fall
              # back rather than silently running nothing.
              configs="$fallback"
            fi
          fi

          echo "Resolved smoke configs: $configs"
          echo "configs=$configs" >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.detect.outputs.configs != ''
        uses: astral-sh/setup-uv@v3

      - name: Sync environment (CPU torch)
        if: steps.detect.outputs.configs != ''
        run: UV_TORCH_BACKEND=cpu uv sync --python 3.12

      - name: Generate smoke dataset
        if: steps.detect.outputs.configs != ''
        run: uv run python scripts/make_smoke_data.py

      - name: Run targeted smoke
        if: steps.detect.outputs.configs != ''
        run: uv run python tool/tsf.py smoke --config ${{ steps.detect.outputs.configs }}
