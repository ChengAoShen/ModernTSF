# Smoke run for QuantilePatchTST on the tiny built-in smoke dataset (CPU, 1 epoch).
extends = ["../base.toml", "../datasets/smoke.toml", "../models/QuantilePatchTST.toml"]

[experiment]
description = "Smoke: QuantilePatchTST"

[experiment.runtime]
device = "cpu"
num_workers = 0

[task]
seq_len = 96
label_len = 0
pred_len = 12
features = "M"

[training]
epochs = 1
batch_size = 16
loss = "quantile"
patience = 1

[evaluation]
metrics = ["crps", "wql", "coverage_80", "width_80", "mae", "mse"]

[model.params]
enc_in = 6
patch_len = 16
stride = 8
e_layers = 2
d_model = 32
n_heads = 4
d_ff = 64
